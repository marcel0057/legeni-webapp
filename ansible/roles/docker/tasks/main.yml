---
- name: Installer les prérequis
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3-docker]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Créer le dossier des clés apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Télécharger la clé GPG de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Ajouter le dépôt apt de Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Installer Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Démarrer et activer le service Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Autoriser l'utilisateur à utiliser Docker sans sudo
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
