---
# Utilisateur qui lancera Docker sans sudo (celui qui exécute ansible-playbook)
docker_user: "{{ lookup('env', 'USER') }}"
docker_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
